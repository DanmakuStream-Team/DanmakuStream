Name: danmakustream-api
Host: 0.0.0.0
Port: 8080

Auth:
  AccessSecret: "your-jwt-secret-key-change-in-production"
  AccessExpire: 86400  # 24 hours in seconds

# 容器网络内使用 Compose 服务名，而不是 localhost
Database:
  DataSource: "root:password@tcp(mysql:3306)/danmakustream?charset=utf8mb4&parseTime=True&loc=Local"

VideoDir: "data"

Live:
  RTMPHost: "srs:1935"
  HTTPHost: "srs:8080"

Log:
  Mode: console
  Level: info
