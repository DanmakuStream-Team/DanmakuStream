apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-config
  namespace: danmakustream
data:
  danmakustream.conf: |
    listen 1935;
    max_connections 1000;
    daemon off;
    srs_log_tank console;
    http_api { enabled on; listen 1985; }
    http_server { enabled on; listen 8080; dir ./objs/nginx/html; }
    vhost __defaultVhost__ {
      http_hooks {
        enabled on;
        on_publish http://backend:8080/api/v1/live/hooks/srs;
        on_unpublish http://backend:8080/api/v1/live/hooks/srs;
      }
      hls {
        enabled on;
        hls_fragment 4;
        hls_window 21600;
        hls_path ./objs/nginx/html;
        hls_m3u8_file [app]/[stream].m3u8;
        hls_ts_file [app]/[stream]-[seq].ts;
        hls_cleanup off;
        hls_dispose 0;
      }
    }
