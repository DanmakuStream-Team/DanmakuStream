apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: danmakustream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports: [{ containerPort: 3306 }]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: danmakustream-secrets, key: DB_PASSWORD }
            - name: MYSQL_DATABASE
              value: danmakustream
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
