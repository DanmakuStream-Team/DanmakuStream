apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: danmakustream-microservices
data:
  config.yaml: |
    # 敏感配置由 Deployment 的 Secret 环境变量覆盖，不写入 ConfigMap。
    Name: user-service
    Host: 0.0.0.0
    Port: 8080
    Auth:
      AccessExpire: 86400
    VideoDir: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: danmakustream-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          # 发布流水线必须将占位标签替换为 ${GITHUB_SHA::12}。
          image: danmakustream/user-service:000000000000
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: micro-secrets
                  key: USER_DATABASE_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: micro-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: micro-secrets
                  key: INTERNAL_API_TOKEN
            - name: SERVICE_NAME
              value: user-service
            - name: SERVICE_VERSION
              value: microservice-0.1.0
            - name: COMMIT_SHA
              value: "000000000000"
            - name: BUILD_TIME
              value: "set-by-ci"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/etc/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: media
              mountPath: /app/data

          livenessProbe:
            httpGet:
              path: /api/v1/livez
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: user-service-config
        - name: media
          persistentVolumeClaim:
            claimName: micro-media-data

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: danmakustream-microservices
spec:
  selector:
    app: user-service
  ports:
    - port: 8080
      targetPort: 8080
