# 模板：复制为 secret.yaml（不入库）或用 kubectl create secret 生成。
# 数据库口令与 JWT 仅存于 Secret；ConfigMap 中的口令为占位符，部署时替换或经环境变量注入。
apiVersion: v1
kind: Secret
metadata:
  name: micro-secrets
  namespace: danmakustream-microservices
type: Opaque
stringData:
  DB_PASSWORD_USER: "replace-me"
  DB_PASSWORD_CONTENT: "replace-me"
  DB_PASSWORD_ENGAGEMENT: "replace-me"
  JWT_SECRET: "replace-me"
  INTERNAL_TOKEN: "replace-me"
