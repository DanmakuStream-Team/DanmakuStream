# 模板：复制为 secret.yaml（不入库）或用 kubectl create secret 生成。
# 数据库 DSN、口令、JWT 与内部 Token 只存于 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: micro-secrets
  namespace: danmakustream-microservices
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "replace-with-strong-root-password"
  USER_DB_PASSWORD: "replace-with-url-safe-password"
  CONTENT_DB_PASSWORD: "replace-with-url-safe-password"
  ENGAGEMENT_DB_PASSWORD: "replace-with-url-safe-password"
  USER_DATABASE_DSN: "user_app:replace-with-url-safe-password@tcp(mysql:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local"
  CONTENT_DATABASE_DSN: "content_app:replace-with-url-safe-password@tcp(mysql:3306)/content_db?charset=utf8mb4&parseTime=True&loc=Local"
  ENGAGEMENT_DATABASE_DSN: "engagement_app:replace-with-url-safe-password@tcp(mysql:3306)/engagement_db?charset=utf8mb4&parseTime=True&loc=Local"
  JWT_SECRET: "replace-with-at-least-32-random-characters"
  INTERNAL_API_TOKEN: "replace-with-at-least-32-random-characters"
