apiVersion: v1
kind: ConfigMap
metadata:
  name: content-service-config
  namespace: danmakustream-microservices
data:
  config.yaml: |
    # 敏感配置由 Deployment 的 Secret 环境变量覆盖，不写入 ConfigMap。
    Name: content-service
    Host: 0.0.0.0
    Port: 8080
    Auth:
      AccessExpire: 86400
    VideoDir: data
    Dependencies:
      UserBaseURL: http://user-service:8080
      TimeoutMS: 1500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: danmakustream-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          # 发布流水线必须将占位标签替换为完整 ${GITHUB_SHA}。
          image: ghcr.io/danmakustream-team/content-service:0000000000000000000000000000000000000000
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: micro-secrets
                  key: CONTENT_DATABASE_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: micro-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: micro-secrets
                  key: INTERNAL_API_TOKEN
            - name: USER_SERVICE_URL
              value: http://user-service:8080
            - name: AUTO_MIGRATE
              value: "true"
            - name: SERVICE_NAME
              value: content-service
            - name: SERVICE_VERSION
              value: microservice-0.1.0
            - name: COMMIT_SHA
              value: "0000000000000000000000000000000000000000"
            - name: BUILD_TIME
              value: "1970-01-01T00:00:00Z"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/etc/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: media
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/v1/livez
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: content-service-config
        - name: media
          persistentVolumeClaim:
            claimName: micro-media-data
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: danmakustream-microservices
spec:
  selector:
    app: content-service
  ports:
    - port: 8080
      targetPort: 8080
