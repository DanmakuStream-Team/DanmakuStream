apiVersion: v1
kind: ConfigMap
metadata:
  name: engagement-service-config
  namespace: danmakustream-microservices
data:
  config.yaml: |
    # 与 deploy/configs/engagement-service.yaml 一致；口令为占位符，部署时替换为 Secret 值
    Name: engagement-service
    Host: 0.0.0.0
    Port: 8080
    Auth:
      AccessSecret: "FROM_SECRET_JWT"
      AccessExpire: 86400
    Database:
      DataSource: "engagement_app:FROM_SECRET@tcp(mysql:3306)/engagement?charset=utf8mb4&parseTime=True&loc=Local"
    Dependencies:
      UserBaseURL: http://user-service:8080
      ContentBaseURL: http://content-service:8080
      InternalToken: "FROM_SECRET"
      TimeoutMS: 1500
    Live:
      RTMPHost: srs:1935
    Build:
      Version: microservices-0.1.0
      GitSHA: "dev"
      Time: "dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-service
  namespace: danmakustream-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engagement-service
  template:
    metadata:
      labels:
        app: engagement-service
    spec:
      containers:
        - name: engagement-service
          image: danmakustream/engagement-service:microservices-0.1.0
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true

          livenessProbe:
            httpGet:
              path: /api/v1/livez
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: engagement-service-config

---
apiVersion: v1
kind: Service
metadata:
  name: engagement-service
  namespace: danmakustream-microservices
spec:
  selector:
    app: engagement-service
  ports:
    - port: 8080
      targetPort: 8080
