# DanmakuStream 单体版 CI（第一阶段）
#
# 流水线顺序（任一步失败即终止，后续步骤不执行）：
#   backend-test ─┬─> api-test ─┬─> docker-build（仅构建，不推送）
#   frontend-build ─────────────┘
#
# 阻断规则（对齐课程任务书）：
#   - 单元测试失败 → 停止，不构建镜像
#   - API/集成测试失败 → 停止，不构建镜像
#   - 前端构建失败 → 停止，不构建镜像
#   - 镜像仅在全部通过后构建，带 commit sha 版本号（不使用裸 latest）
#   - PR 只做构建与测试；部署（deploy.yml）在合入 dev 后另行触发

name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend-test:
    name: 后端编译与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Unit tests (UNIT-TC13)
        working-directory: backend
        # set -o pipefail 确保管道中 go test 的非零退出码不被 tee 吞掉：
        # 红灯演练（run 33032768023）发现默认行为下测试失败仍返回 0，已修复
        run: |
          set -o pipefail
          go test ./... -v | tee unit-test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: backend/unit-test-output.txt

  frontend-build:
    name: 前端依赖安装与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (type-check + vite build)
        working-directory: frontend
        run: npm run build

  api-test:
    name: API/集成测试（INT-TC13）
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: danmakustream
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install mysql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Build backend
        working-directory: backend
        run: go build -o /tmp/dms-api ./api/main.go
      - name: Run backend against service MySQL
        run: |
          cat > /tmp/config-ci.yaml <<'EOF'
          Name: danmakustream-api
          Host: 0.0.0.0
          Port: 8080
          Auth:
            AccessSecret: "ci-only-secret"
            AccessExpire: 86400
          Database:
            DataSource: "root:password@tcp(127.0.0.1:3306)/danmakustream?charset=utf8mb4&parseTime=True&loc=Local"
          VideoDir: "/tmp/dms-data"
          Live:
            RTMPHost: "localhost:1935"
            HTTPHost: "localhost:8081"
          Log:
            Mode: console
            Level: info
          EOF
          mkdir -p /tmp/dms-data
          /tmp/dms-api -f /tmp/config-ci.yaml > /tmp/dms-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/v1/health | grep -q '"status":"ok"' && break
            [ "$i" = 30 ] && { cat /tmp/dms-api.log; exit 1; }
            sleep 2
          done
      - name: Run API test suite
        env:
          MYSQL_CMD: "mysql -h127.0.0.1 -P3306 -uroot -ppassword danmakustream"
        run: |
          set -o pipefail
          tests/api/uc13-admin-test.sh | tee api-test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-output
          path: api-test-output.txt
      - name: Stop backend
        if: always()
        run: pkill -f dms-api || true

  docker-build:
    name: 构建前后端镜像（版本号 = commit sha）
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, api-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -t danmakustream/backend:${GITHUB_SHA::12} ./backend
          docker tag danmakustream/backend:${GITHUB_SHA::12} danmakustream/backend:monolith
      - name: Build frontend image
        run: |
          docker build -t danmakustream/frontend:${GITHUB_SHA::12} ./frontend
          docker tag danmakustream/frontend:${GITHUB_SHA::12} danmakustream/frontend:monolith
      - name: Show images
        run: docker images "danmakustream/*"
      # 镜像推送（GHCR）与 K8s 部署在合入 dev 后由 deploy.yml 执行：
      # docker push ghcr.io/${{ github.repository }}/backend:${GITHUB_SHA::12} ...
