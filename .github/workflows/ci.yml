# DanmakuStream 单体版 CI（第一阶段）
#
# 流水线顺序（任一步失败即终止，后续步骤不执行）：
#   backend-test ─┬─> api-test ─────┐
#                 └─> e2e-test ─────┼─> docker-build（仅构建，不推送）
#   frontend-build ─> e2e-test ─────┘
#
# 阻断规则（对齐课程任务书）：
#   - 单元测试失败 → 停止，不构建镜像
#   - API/集成测试失败 → 停止，不构建镜像
#   - E2E 测试失败 → 停止，不构建镜像
#   - 前端构建失败 → 停止，不构建镜像
#   - 镜像仅在全部通过后构建，带 commit sha 版本号（不使用裸 latest）
#   - PR 只做构建与测试；镜像仓库和集群凭据就绪后，再由独立 CD 工作流发布、部署

name: ci

on:
  push:
    branches: [dev, main, 'whh用户b-test']
  pull_request:
    branches: [dev, main]

jobs:
  backend-test:
    name: 后端编译与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Unit tests (all use cases)
        working-directory: backend
        # 显式启用 pipefail，避免 go test 失败被 tee 的成功退出码掩盖。
        run: |
          set -o pipefail
          go test ./... -v | tee unit-test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: backend/unit-test-output.txt

  frontend-build:
    name: 前端依赖安装与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (type-check + vite build)
        working-directory: frontend
        run: npm run build

  api-test:
    name: API/集成测试（UC05/09/10/13）
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: danmakustream
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install mysql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Run UC05/09/10 MySQL integration tests
        working-directory: backend
        env:
          DANMAKU_TEST_ADMIN_DSN: "root:password@tcp(127.0.0.1:3306)/danmakustream?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -o pipefail
          go test -count=1 -tags=integration \
            ./internal/handler/v1/live \
            ./internal/logic/danmaku \
            ./integration -v \
            | tee d-engagement-integration-output.txt
      - name: Build backend
        working-directory: backend
        run: go build -o /tmp/dms-api ./api/main.go
      - name: Run backend against service MySQL
        run: |
          cat > /tmp/config-ci.yaml <<'EOF'
          Name: danmakustream-api
          Host: 0.0.0.0
          Port: 8080
          Auth:
            AccessSecret: "ci-only-secret"
            AccessExpire: 86400
          Database:
            DataSource: "root:password@tcp(127.0.0.1:3306)/danmakustream?charset=utf8mb4&parseTime=True&loc=Local"
          VideoDir: "/tmp/dms-data"
          Live:
            RTMPHost: "localhost:1935"
            HTTPHost: "localhost:8081"
          Log:
            Mode: console
            Level: info
          EOF
          mkdir -p /tmp/dms-data
          /tmp/dms-api -f /tmp/config-ci.yaml > /tmp/dms-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/v1/health | grep -q '"status":"ok"' && break
            [ "$i" = 30 ] && { cat /tmp/dms-api.log; exit 1; }
            sleep 2
          done
      - name: Run API test suite
        env:
          MYSQL_CMD: "mysql -h127.0.0.1 -P3306 -uroot -ppassword danmakustream"
        run: |
          set -o pipefail
          tests/api/uc13-admin-test.sh | tee api-test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-output
          path: api-test-output.txt
          if-no-files-found: ignore
      - name: Upload UC05/09/10 integration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-engagement-integration-output
          path: backend/d-engagement-integration-output.txt
          if-no-files-found: ignore
      - name: Stop backend
        if: always()
        run: pkill -f dms-api || true

  e2e-test:
    name: 浏览器 E2E（UC05/09/10）
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: danmakustream
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install mysql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Build and start backend
        run: |
          cat > /tmp/config-ci.yaml <<'EOF'
          Name: danmakustream-api
          Host: 0.0.0.0
          Port: 8080
          Auth:
            AccessSecret: "ci-only-secret"
            AccessExpire: 86400
          Database:
            DataSource: "root:password@tcp(127.0.0.1:3306)/danmakustream?charset=utf8mb4&parseTime=True&loc=Local"
          VideoDir: "/tmp/dms-data"
          Live:
            RTMPHost: "localhost:1935"
            HTTPHost: "localhost:8081"
          Log:
            Mode: console
            Level: info
          EOF
          mkdir -p /tmp/dms-data
          cd backend
          go build -o /tmp/dms-api ./api/main.go
          /tmp/dms-api -f /tmp/config-ci.yaml > /tmp/dms-api-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/v1/health | grep -q '"status":"ok"' && break
            [ "$i" = 30 ] && { cat /tmp/dms-api-e2e.log; exit 1; }
            sleep 2
          done
      - name: Run UC05/09/10 Playwright tests
        working-directory: frontend
        env:
          MYSQL_CMD: "mysql -h127.0.0.1 -P3306 -uroot -ppassword danmakustream"
        run: npm run test:e2e:d
      - name: Upload E2E report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-engagement-e2e-report
          path: |
            docs/testing/reports/engagement-e2e/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Stop backend
        if: always()
        run: pkill -f dms-api || true

  member-b-integration:
    name: 成员 B 用例集成测试（INT-TC01/07/08/11）
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run UC01/07/08/11 MySQL integration tests
        working-directory: backend
        env:
          DANMAKU_TEST_ADMIN_DSN: "root:password@tcp(127.0.0.1:3306)/?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -o pipefail
          go test -tags=integration ./integration \
            -run '^TestMemberBUseCasesWithMySQL$' -count=1 -v \
            | tee member-b-integration-output.txt
      - name: Upload member B test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-b-integration-output
          path: backend/member-b-integration-output.txt
          if-no-files-found: ignore

  docker-build:
    name: 构建前后端镜像（版本号 = commit sha）
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, api-test, e2e-test, member-b-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -t danmakustream/backend:${GITHUB_SHA::12} ./backend
          docker tag danmakustream/backend:${GITHUB_SHA::12} danmakustream/backend:monolith
      - name: Build frontend image
        run: |
          docker build -t danmakustream/frontend:${GITHUB_SHA::12} ./frontend
          docker tag danmakustream/frontend:${GITHUB_SHA::12} danmakustream/frontend:monolith
      - name: Show images
        run: docker images "danmakustream/*"
      # 当前仅验证镜像可构建。K8s 部署前需由独立 CD 工作流推送到 GHCR 等集群可访问的仓库。
