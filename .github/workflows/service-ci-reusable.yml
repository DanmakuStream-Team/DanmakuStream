name: reusable-service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Service directory and image name
        required: true
        type: string
      service_version:
        description: Version exposed by the service version endpoint
        required: false
        default: microservice-0.1.0
        type: string

      mysql_integration:
        description: Run the service integration suite against an isolated MySQL
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    name: test → image (${{ inputs.service }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: user_db
          MYSQL_USER: user_app
          MYSQL_PASSWORD: user_app_pass
          MYSQL_ROOT_PASSWORD: root_test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ inputs.service }}/go.mod
          cache-dependency-path: services/${{ inputs.service }}/go.sum

      - name: Build service
        working-directory: services/${{ inputs.service }}
        run: go build ./...

      - name: Test service
        working-directory: services/${{ inputs.service }}
        run: |
          set -o pipefail
          go test -count=1 ./... -v | tee service-test-output.txt

      - name: MySQL integration tests
        if: inputs.mysql_integration
        working-directory: services/${{ inputs.service }}
        env:
          USER_SERVICE_TEST_DSN: user_app:user_app_pass@tcp(127.0.0.1:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local
          CONTENT_SERVICE_TEST_DSN: user_app:user_app_pass@tcp(127.0.0.1:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local
        run: |
          set -o pipefail
          go test -count=1 -tags=integration ./integration -v | tee integration-test-output.txt

      - name: engagement-service API/WebSocket integration coverage
        if: inputs.service == 'engagement-service'
        working-directory: services/engagement-service
        env:
          ENGAGEMENT_INTEGRATION_DSN: root:root_test_pass@tcp(127.0.0.1:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local
        run: |
          set -euo pipefail
          go test -count=1 -v \
            -coverpkg=./internal/... \
            -coverprofile=engagement-coverage.out \
            ./tests \
            | tee engagement-integration-output.txt
          go tool cover -func=engagement-coverage.out | tee engagement-coverage.txt
          coverage="$(go tool cover -func=engagement-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 60) { printf "engagement-service coverage %.1f%% is below required 60%%\n", coverage; exit 1 } }'

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service }}-test-${{ github.sha }}
          path: |
            services/${{ inputs.service }}/service-test-output.txt
            services/${{ inputs.service }}/integration-test-output.txt
            services/${{ inputs.service }}/engagement-integration-output.txt
            services/${{ inputs.service }}/engagement-coverage.out
            services/${{ inputs.service }}/engagement-coverage.txt
          if-no-files-found: warn

      - name: Compute immutable image name
        id: image
        shell: bash
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build commit-SHA image
        run: |
          docker build \
            --build-arg SERVICE_VERSION="${{ inputs.service_version }}" \
            --build-arg COMMIT_SHA="${{ steps.image.outputs.tag }}" \
            --build-arg BUILD_TIME="${{ steps.image.outputs.build_time }}" \
            -t "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" \
            "services/${{ inputs.service }}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: docker push "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}"
