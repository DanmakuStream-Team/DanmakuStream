name: engagement-service-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    # The feature branch entry is temporary and is removed after the coverage
    # baseline run; dev remains the only long-lived push trigger.
    branches: [dev, codex/engagement-coverage]

permissions:
  contents: read
  packages: write

jobs:
  engagement-service:
    uses: ./.github/workflows/service-ci-reusable.yml
    with:
      service: engagement-service
