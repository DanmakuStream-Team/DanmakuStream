# CD：CI 全绿后构建版本镜像并部署到公网 k3s，失败自动回滚
#
# 本文件是可复用工作流（workflow_call），由 ci.yml 的 deploy job 在
# "push 合并到 dev 且全部测试通过" 时调用——保证：
#   - 普通 PR 检查、功能分支推送只跑 CI，绝不部署；
#   - 镜像只有在所有测试通过后才构建/推送；
#   - production environment 的 concurrency 保证同一时间只有一次部署。
#
# 所需 GitHub Environment（production）的 Secrets 见 docs/deploy/cd-pipeline.md：
#   K3S_HOST / K3S_SSH_USER / K3S_SSH_KEY / K3S_HOST_KEY / PUBLIC_URL

name: cd-deploy

on:
  workflow_call:

concurrency:
  group: production-deploy
  cancel-in-progress: false   # 排队而非取消，保证同一时间仅一次部署

env:
  REGISTRY: ghcr.io
  SHA_TAG: ${{ github.sha }}   # 完整 SHA，kubectl set image 时截取使用

jobs:
  build-push-images:
    name: 构建并推送版本镜像（GHCR）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}-backend"
          docker build -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:dev" ./backend
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:dev"
          echo "BACKEND_IMAGE=$IMAGE:${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}-frontend"
          docker build -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:dev" ./frontend
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:dev"
          echo "FRONTEND_IMAGE=$IMAGE:${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - id: meta
        name: Export image references
        run: |
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

  deploy-k3s:
    name: 部署到公网 k3s（含预检/验证/回滚）
    runs-on: ubuntu-latest
    needs: build-push-images
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
          HOST_KEY: ${{ secrets.K3S_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Precheck cluster（任一失败不更新生产）
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_SSH_USER: ${{ secrets.K3S_SSH_USER }}
        run: |
          ssh "${K3S_SSH_USER}@${K3S_HOST}" bash -s -- danmakustream precheck \
            < scripts/k3s-deploy.sh

      - name: Deploy, verify and rollback on failure
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_SSH_USER: ${{ secrets.K3S_SSH_USER }}
          BACKEND_IMAGE: ${{ needs.build-push-images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-push-images.outputs.frontend_image }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          set -o pipefail
          ssh "${K3S_SSH_USER}@${K3S_HOST}" bash -s -- \
            danmakustream deploy "$BACKEND_IMAGE" "$FRONTEND_IMAGE" \
            < scripts/k3s-deploy.sh 2>&1 | tee deploy-output.txt

      - name: Public health check（公网冒烟）
        id: public_health
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/pub.json -w '%{http_code}' "$PUBLIC_URL/api/v1/health" || true)
            if [ "$code" = "200" ] && grep -q '"db":"up"' /tmp/pub.json; then
              echo "public health OK"; exit 0
            fi
            sleep 6
          done
          echo "public health check failed"; cat /tmp/pub.json 2>/dev/null; exit 1

      - name: Roll back when public health check fails
        if: failure() && steps.public_health.outcome == 'failure'
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_SSH_USER: ${{ secrets.K3S_SSH_USER }}
        run: |
          ssh "${K3S_SSH_USER}@${K3S_HOST}" bash -s -- \
            danmakustream rollback \
            < scripts/k3s-deploy.sh

      - name: Collect evidence（成功与失败都保留证据）
        if: always()
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_SSH_USER: ${{ secrets.K3S_SSH_USER }}
        run: |
          {
            echo "== CD 部署证据 =="
            echo "时间(UTC): $(date -u '+%F %T')"
            echo "Commit SHA: ${GITHUB_SHA}"
            echo "Backend 镜像: ${{ needs.build-push-images.outputs.backend_image }}"
            echo "Frontend 镜像: ${{ needs.build-push-images.outputs.frontend_image }}"
            echo "== 部署输出（含预检/rollout/验证/回滚） =="
            cat deploy-output.txt 2>/dev/null || true
            echo "== 集群状态快照 =="
            ssh "${K3S_SSH_USER}@${K3S_HOST}" 'sudo k3s kubectl -n danmakustream get pods,svc,ingress,pvc -o wide; sudo k3s kubectl -n danmakustream get events --sort-by=.lastTimestamp | tail -30' 2>/dev/null || true
          } > cd-evidence.txt
          # 失败时抓当前 backend 日志，供回滚原因分析
          ssh "${K3S_SSH_USER}@${K3S_HOST}" 'sudo k3s kubectl -n danmakustream logs deploy/backend --tail=100' >> cd-evidence.txt 2>/dev/null || true

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-evidence-${{ github.sha }}
          path: cd-evidence.txt
          if-no-files-found: warn
