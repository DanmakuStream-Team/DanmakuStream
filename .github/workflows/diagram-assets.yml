name: PlantUML Diagram Assets

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_diagram_assets.py"
      - ".github/workflows/diagram-assets.yml"
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "scripts/check_diagram_assets.py"
      - ".github/workflows/diagram-assets.yml"

permissions:
  contents: read

jobs:
  validate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require PlantUML source and SVG/PNG exports
        run: python scripts/check_diagram_assets.py
