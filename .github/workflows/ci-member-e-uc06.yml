# DanmakuStream 成员 E（UC06 个人视频资料库）专属 CI
#
# 触发条件：
#   - push 到 feature/p5-* 分支（成员 E 的功能开发分支）
#   - push 到 dev 分支（集成验证）
#
# 流水线（任一步失败立即终止，不允许继续部署）：
#   1. frontend-build  -> 前端依赖安装 + 构建（vue-tsc 类型检查 + vite build）
#   2. backend-build   -> 后端全量编译（go build ./...）
#   3. library-unit    -> UC06 相关单元测试（user + collection 两个包）
#   4. e2e-smoke       -> 全量 E2E（3 个 spec 文件），确保改动不破坏已有功能
#
# 阻断规则：
#   - 前端构建失败 → CI 红 ✗，终止
#   - 后端编译失败 → CI 红 ✗，终止
#   - UC06 单元测试失败 → CI 红 ✗，终止
#   - E2E 任一条失败 → CI 红 ✗，终止
#   - 全部通过 → CI 绿 ✓（不部署，部署由通用 CI 的 deploy job 统一负责）

name: ci-member-e-uc06

on:
  push:
    branches:
      - 'feature/p5-*'
      - 'dev'

jobs:
  frontend-build:
    name: 前端依赖安装与构建（UC06 关联页面）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build (type-check + vite build)
        working-directory: frontend
        run: npm run build

  backend-build:
    name: 后端编译检查（go build ./...）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build all packages
        working-directory: backend
        run: go build ./...

  library-unit:
    name: UC06 单元测试（user + collection 包）
    runs-on: ubuntu-latest
    needs: backend-build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: danmakustream
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run UC06 unit tests (user + collection)
        working-directory: backend
        env:
          DANMAKU_TEST_ADMIN_DSN: "root:password@tcp(127.0.0.1:3306)/danmakustream?charset=utf8mb4&parseTime=True&loc=Local"
        run: |
          set -o pipefail
          {
            echo "===== ./internal/handler/v1/user/... ====="
            go test -count=1 -v ./internal/handler/v1/user/...
            echo ""
            echo "===== ./internal/handler/v1/collection/... ====="
            go test -count=1 -v ./internal/handler/v1/collection/...
          } | tee uc06-library-unit-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc06-library-unit-output
          path: backend/uc06-library-unit-output.txt
          if-no-files-found: warn

  e2e-smoke:
    name: E2E 全量冒烟（3 个 spec，防止破坏已有功能）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-build, backend-build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: danmakustream
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium with deps
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install mysql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Build and start backend
        run: |
          cat > /tmp/config-ci-uc06.yaml <<'EOF'
          Name: danmakustream-api
          Host: 0.0.0.0
          Port: 8080
          Auth:
            AccessSecret: "ci-uc06-only-secret"
            AccessExpire: 86400
          Database:
            DataSource: "root:password@tcp(127.0.0.1:3306)/danmakustream?charset=utf8mb4&parseTime=True&loc=Local"
          VideoDir: "/tmp/dms-data-uc06"
          Live:
            RTMPHost: "localhost:1935"
            HTTPHost: "localhost:8081"
          Log:
            Mode: console
            Level: info
          EOF
          mkdir -p /tmp/dms-data-uc06
          cd backend
          go build -o /tmp/dms-api-uc06 ./api/main.go
          /tmp/dms-api-uc06 -f /tmp/config-ci-uc06.yaml > /tmp/dms-api-uc06.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/v1/health | grep -q '"status":"ok"' && break
            [ "$i" = 30 ] && { cat /tmp/dms-api-uc06.log; exit 1; }
            sleep 2
          done
      - name: Run full Playwright E2E (all specs)
        working-directory: frontend
        env:
          MYSQL_CMD: "mysql -h127.0.0.1 -P3306 -uroot -ppassword danmakustream"
        run: |
          set -o pipefail
          npx playwright test --reporter=list,html \
            | tee /tmp/e2e-smoke-output.txt
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-evidence
          if-no-files-found: warn
          path: |
            /tmp/e2e-smoke-output.txt
            frontend/test-results/
            playwright-report/
      - name: Stop backend
        if: always()
        run: pkill -f dms-api-uc06 || true
