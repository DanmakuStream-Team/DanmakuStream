name: microservices-e2e

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'deploy/nginx-gateway-microservices.conf'
      - 'deploy/k8s/microservices/**'
      - 'deploy/platform/**'
      - 'docker-compose.microservices.yml'
      - 'scripts/microservices-db-init.sql'
      - 'scripts/run-microservices-e2e.sh'
      - 'scripts/render-microservice-manifests.sh'
      - 'scripts/k3s-microservice-deploy.sh'
      - 'scripts/check-microservice-hpa.sh'
      - 'scripts/k3s-hpa-chaos.sh'
      - 'scripts/render-hpa-timeline.py'
      - '.github/workflows/microservices-e2e.yml'
      - '.github/workflows/microservice-cd.yml'
      - '.github/workflows/microservice-resilience.yml'
  push:
    branches: [dev]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'deploy/nginx-gateway-microservices.conf'
      - 'deploy/k8s/microservices/**'
      - 'deploy/platform/**'
      - 'docker-compose.microservices.yml'
      - 'scripts/microservices-db-init.sql'
      - 'scripts/run-microservices-e2e.sh'
      - 'scripts/render-microservice-manifests.sh'
      - 'scripts/k3s-microservice-deploy.sh'
      - 'scripts/check-microservice-hpa.sh'
      - 'scripts/k3s-hpa-chaos.sh'
      - 'scripts/render-hpa-timeline.py'
      - '.github/workflows/microservices-e2e.yml'
      - '.github/workflows/microservice-cd.yml'
      - '.github/workflows/microservice-resilience.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: Compose + Gateway + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install media fixture dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate Kubernetes HPA coverage
        run: bash scripts/check-microservice-hpa.sh
      - name: Run microservice E2E environment
        run: bash scripts/run-microservices-e2e.sh
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-e2e-${{ github.sha }}
          path: artifacts/microservices-e2e/
          if-no-files-found: warn
          retention-days: 14
