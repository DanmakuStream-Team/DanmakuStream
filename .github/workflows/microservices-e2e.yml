name: microservices-e2e

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'deploy/nginx-gateway-microservices.conf'
      - 'deploy/platform/**'
      - 'docker-compose.microservices.yml'
      - 'scripts/microservices-db-init.sql'
      - 'scripts/run-microservices-e2e.sh'
      - '.github/workflows/microservices-e2e.yml'
  push:
    branches: [dev]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'deploy/nginx-gateway-microservices.conf'
      - 'deploy/platform/**'
      - 'docker-compose.microservices.yml'
      - 'scripts/microservices-db-init.sql'
      - 'scripts/run-microservices-e2e.sh'
      - '.github/workflows/microservices-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: Compose + Gateway + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run microservice E2E environment
        run: bash scripts/run-microservices-e2e.sh
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-e2e-${{ github.sha }}
          path: artifacts/microservices-e2e/
          if-no-files-found: warn
          retention-days: 14
